<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="sistema de inventario para una pagina deportiva">
    <meta name="keywords" content="inventario, pagina deportiva, sistema de inventario">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Johan Stid Calderón - JohanSport">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" user-scalable=no>
    <title>Inicio sesión</title>
    <link rel="stylesheet" href="CSS/styles.css" type="text/css"> 
    <link rel="icon" href="img/icon.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header"> 
    <img class="icono" width="80" height="80" alt="Logo" src="img/Logo.png ">
    <h1>JohanSport</h1>
    <i class="menu fa-solid fa-bars"> </i>
    </header>
    <h2 class="titulo2">Inicio de sesión</h2>
    <div class="container">
        <main class="main">
            <form action="dashboard.html" class="form-login" id="loginForm">
                <input class="input_email" id="loginEmail" type="email" placeholder="Email:" maxlength="20" minlength="12" required>
                <input class="input_login" id="password" type="password" placeholder="Contraseña:" maxlength="15" minlength="8" required>
                <button type="submit" class="btn_login">Iniciar sesión</button>
            </form>
            <p id="loginStatus" class="form-status"></p>
    </div>
    <a class="olvidaste" href="#">¿Olvidaste tu contraseña?</a>
    <form action="registrarse2.html">
        <input class="btn_registrarse" type="submit" value="Registrarse" name="Registrarse">
    </form>
        </main>
        <footer>
            <small class="author">JohanSport&copy;2026</small>
        </footer>
        <script src="js/app.js"></script>
</body>
</html>
