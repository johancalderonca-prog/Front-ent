<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Actualizar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header class="navbar">
        <div class="logo">⚡ JohanSport</div>
        <input type="text" placeholder="Buscar" class="search-bar">
        <a href="perfil.html" class="menu-item">Perfil</a>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <a href="dashboard.html" class="menu-item">Inicio</a>
            <a href="crear.html" class="menu-item">Crear productos Inventario</a>
            <a href="visualizar.html" class="menu-item">Visualizar productos</a>
            <a href="actualizar.html" class="menu-item">Actualizar productos</a>
            <a href="eliminar.html" class="menu-item">Eliminar producto(s)</a>
        </nav>

        <main class="content">
            <h3>Actualización de producto</h3>
            <div style="text-align: center; background: white; padding: 10px;">
                <img src="nike.png" width="100" alt="Producto a actualizar">
            </div>

            <label>Nombre del producto</label>
            <input type="text" class="input-field" value="Zapatillas Nike">

            <div style="display: flex; gap: 5px;">
                <div style="flex:1">
                    <label>Código</label>
                    <input type="text" class="input-field" value="00123">
                </div>
                <div style="flex:1">
                    <label>Categoría</label>
                    <input type="text" class="input-field" placeholder="Categoría">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-update">Guardar cambios</button>
                <button class="btn btn-cancel">Cancelar</button>
            </div>
        </main>
    </div>
</body>
</html>
