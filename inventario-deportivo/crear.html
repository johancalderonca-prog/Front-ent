<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Crear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header class="navbar">
        <div class="logo">⚡ JohanSport</div>
        <input type="text" placeholder="Buscar" class="search-bar">
        <a href="perfil.html" class="menu-item">Perfil</a>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <a href="dashboard.html" class="menu-item">Inicio</a>
            <a href="crear.html" class="menu-item">Crear productos Inventario</a>
            <a href="visualizar.html" class="menu-item">Visualizar productos</a>
            <a href="actualizar.html" class="menu-item">Actualizar productos</a>
            <a href="eliminar.html" class="menu-item">Eliminar producto(s)</a>
        </nav>

        <main class="content">
            <h3>Crear producto</h3>
            <label>Nombre del producto</label>
            <input type="text" class="input-field" placeholder="Nombre">

            <label>Categoría</label>
            <input type="text" class="input-field" placeholder="Categoría">

            <div style="display: flex; gap: 10px;">
                <input type="text" placeholder="Precio" style="width: 45%;">
                <input type="text" placeholder="Cantidad" style="width: 45%;">
            </div>

            <div class="btn-group">
                <button class="btn btn-save">Guardar</button>
                <button class="btn btn-cancel">Cancelar</button>
            </div>
        </main>
    </div>
</body>
</html>
