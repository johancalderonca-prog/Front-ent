<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header class="navbar">
        <div class="logo">⚡ JohanSport</div>
        <input type="text" placeholder="Buscar" class="search-bar">
        <a href="perfil.html" class="menu-item">Perfil</a>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <a href="dashboard.html" class="menu-item">Inicio</a>
            <a href="crear.html" class="menu-item">Crear productos Inventario</a>
            <a href="visualizar.html" class="menu-item">Visualizar productos</a>
            <a href="actualizar.html" class="menu-item">Actualizar productos</a>
            <a href="eliminar.html" class="menu-item">Eliminar producto(s)</a>
        </nav>

        <main class="content">
            <h3>¡Bienvenido a la tienda de Johan!</h3>
            <div class="card">
                <img src="ventas-icon.png" width="50" alt="Ventas del dia">
                <div>Total ventas hoy: <br> 150</div>
            </div>
            <div class="card">
                <img src="bolsa-icon.png" width="50" alt="Productos disponibles">
                <div>Productos disponibles: <br> 330</div>
            </div>
        </main>
    </div>
</body>
</html>
