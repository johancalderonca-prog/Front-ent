<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Eliminar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header class="navbar">
        <div class="logo">⚡ JohanSport</div>
        <input type="text" placeholder="Buscar" class="search-bar">
        <a href="perfil.html" class="menu-item">Perfil</a>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <a href="dashboard.html" class="menu-item">Inicio</a>
            <a href="crear.html" class="menu-item">Crear productos Inventario</a>
            <a href="visualizar.html" class="menu-item">Visualizar productos</a>
            <a href="actualizar.html" class="menu-item">Actualizar productos</a>
            <a href="eliminar.html" class="menu-item">Eliminar producto(s)</a>
        </nav>

        <main class="content">
            <h3>Eliminar producto</h3>
            <div style="text-align: center; background: white; padding: 10px;">
                <img src="nike.png" width="100" alt="Producto a eliminar">
            </div>

            <p style="font-size: 14px; text-align: center;">¿Estás seguro de eliminar el siguiente producto?</p>

            <div style="background: white; color: black; padding: 10px; margin-bottom: 10px;">
                <p>Nombre: Zapatillas Nike</p>
                <p>Código: 00123</p>
                <p>Precio: $400.000</p>
            </div>

            <div class="btn-group">
                <button class="btn btn-delete">Eliminar</button>
                <button class="btn">Cancelar</button>
            </div>
        </main>
    </div>
</body>
</html>
