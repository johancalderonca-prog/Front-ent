<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">

    <header class="navbar">
        <div class="logo">
            <span class="bolt">⚡</span> JohanSport
        </div>
        <div class="menu-icon">☰</div>
    </header>

    <main class="login-container">
        <div class="login-box">
            <form>
                <input type="email" placeholder="Email" class="input-field">
                <input type="password" placeholder="Contraseña" class="input-field">
                
                <button type="button" class="btn-ingresar" onclick="window.location.href='dashboard.html'">
                    Ingresar
                </button>
            </form>
        </div>

        <div class="login-footer">
            <a href="#">¿Olvidaste la contraseña?</a>
            <p><strong>Registrarse</strong></p>
        </div>
    </main>

    <footer class="bottom-bar">
        JohanSport2026
    </footer>

</body>
</html>
