<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohanSport - Visualizar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header class="navbar">
        <div class="logo">⚡ JohanSport</div>
        <input type="text" placeholder="Buscar" class="search-bar">
        <a href="perfil.html" class="menu-item">Perfil</a>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <a href="dashboard.html" class="menu-item">Inicio</a>
            <a href="crear.html" class="menu-item">Crear productos Inventario</a>
            <a href="visualizar.html" class="menu-item">Visualizar productos</a>
            <a href="actualizar.html" class="menu-item">Actualizar productos</a>
            <a href="eliminar.html" class="menu-item">Eliminar producto(s)</a>
        </nav>

        <main class="content">
            <h3>Productos destacados</h3>
            <input type="text" placeholder="Buscar producto" class="search-bar" style="width: 80%; margin-bottom: 20px;">

            <div class="card">
                <img src="guantes.png" width="60" alt="Guantes de boxeo">
                <div>
                    <strong>Guantes para boxeo Everlast</strong><br>
                    Precio: 250.000 <br>
                    Und disponibles: 10
                </div>
            </div>

            <div class="card">
                <img src="balon.png" width="60" alt="Balon de futbol">
                <div>
                    <strong>Balón de fútbol Puma</strong><br>
                    Precio: 1.000.000 <br>
                    Und disponibles: 17
                </div>
            </div>
        </main>
    </div>
</body>
</html>
