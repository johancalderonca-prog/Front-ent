<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="author" content="Johan Stid Calderón - JohanSport">
    <meta name="keywords" content="inventario, pagina deportiva, sistema de inventario">
    <meta name="description" content="sistema de inventario para una pagina deportiva">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="CSS/styles.css" type="text/css">
    <link rel="icon" href="img/icon.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Actualizar Usuario</title>
</head>
<body class="dash">
    <header class="headerdashboard">
        <img class="icono" width="80" height="80" alt="Logo" src="img/Logo.png ">
        <form class="search-form">
            <i class="lupa fa fa-search"></i>
            <input type="text" placeholder="Buscar" class="buscar">
        </form>
        <i class="menu fa-solid fa-bars"> </i>
    </header>
    <div class="seccion-principal">
    <nav class="nav">
        <h2><strong>Menú de navegación</strong></h2>
        <ul>
            <li><a  href="dashboard.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="crear.html"><i class="fa-solid fa-plus"></i> Crear Producto</a></li>
            <li><a href="visualizar.html"><i class="fa-solid fa-eye"></i> Ver Productos</a></li>
            <li><a href="actualizar.html"><i class="fa-solid fa-edit"></i> Actualizar Producto</a></li>
            <li><a href="registro.html"><i class="fa-solid fa-user-plus"></i> Registrar Usuarios</a></li>
            <li><a href="usuarios.html"><i class="fa-solid fa-eye"></i> Ver Usuarios</a></li>
            <li><a href="putuser.html"><i class="fa-solid fa-edit"></i> Actualizar Usuario</a></li>
            <form action="index.html">
                <button class="cerrar" type="submit">Cerrar sesión</button>
            </form>
        </ul>
    </nav>
    <div class="contenedor-derecho">
        <main class="dash">
            <section class="formulario">
                <h2 class="titulo2">Actualizar Usuario</h2>
                <form class="formulario-crear" id="userForm">
                    <div class="nombre">
                        <label>Nombre</label>
                        <input type="text" class="reg-nombre" id="userName" placeholder="Nombre completo" maxlength="30" minlength="5" required>
                    </div>
                    <div class="edad">
                        <label>Edad</label>
                        <input type="number" class="reg-edad" id="userAge" placeholder="Edad" min="0" required>
                    </div>
                    <div class="telefono">
                        <label>Teléfono</label>
                        <input type="number" class="reg-telefono" id="userPhone" placeholder="Número de teléfono" maxlength="10" minlength="10" required>
                    </div>
                    <div class="correo">
                        <label>Correo electrónico</label>
                        <input class="reg_email" id="userEmail" type="email" placeholder="Correo electrónico" maxlength="20" minlength="12" required>
                    </div>
                    <div class="contraseña">
                        <label>Contraseña</label>
                        <input class="reg_login" id="userPassword" type="password" placeholder="Contraseña:" maxlength="15" minlength="8" required>
                    </div>
                    <div class="confirmar-contraseña">
                        <label>Confirmar contraseña</label>
                        <input type="password" class="reg_confirmar_login" id="userPasswordConfirm" placeholder="Confirmar contraseña:" maxlength="15" minlength="8" required>
                    </div>
                    <div class="botones-form">
                        <button class="aceptar" type="submit">Actualizar</button>
                        <button class="cancelar" type="button">Cancelar</button>
                    </div>
                </form>
                <p id="userFormStatus" class="form-status"></p>
            </section>
        </main>
    <footer>
        <small class="author">JohanSport&copy;2026</small>
    </footer>
    </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
